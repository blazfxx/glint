name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and lint
        if: runner.os == 'Linux'
        run: pnpm format:check && pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm --filter @glint/desktop build
      # Capture needs a screen: a virtual one on Linux, the runner's desktop on Windows. macOS
      # runners cannot grant Screen Recording, so captures are not exercised there.
      - name: End-to-end (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" pnpm --filter @glint/desktop e2e
      - name: End-to-end (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @glint/desktop e2e
      - name: Package
        run: pnpm --filter @glint/desktop exec electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Glint-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
